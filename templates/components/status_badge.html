{% comment %}
 Badge de status. tone: healthy | attention | exceeded | positive | negative | neutral | critical | info
 Uso: {% include "components/status_badge.html" with label=... tone=... dot=True %}
{% endcomment %}
<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-xs font-medium
 {% if tone == 'positive' %}bg-success-500/10 text-success-700 dark:text-success-300
 {% elif tone == 'negative' %}bg-danger-500/10 text-danger-700 dark:text-danger-300
 {% elif tone == 'attention' %}bg-warning-500/10 text-warning-700 dark:text-warning-300
 {% elif tone == 'exceeded' %}bg-danger-500/10 text-danger-700 dark:text-danger-300
 {% elif tone == 'critical' %}bg-danger-500/15 text-danger-700 dark:text-danger-300
 {% elif tone == 'info' %}bg-info-500/10 text-info-700 dark:text-info-300
 {% else %}bg-muted text-muted-foreground{% endif %}">
 {% if dot %}<span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>{% endif %}
 {{ label }}
</span>
