<!DOCTYPE html>
<html lang="pt-br">
<body style="font-family: Arial, Helvetica, sans-serif; color: #0f172a; background: #f8fafc; padding: 24px;">
  <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 24px; border: 1px solid #e2e8f0;">
    <h2 style="margin-top: 0; color: #0f172a;">FINTECPESSOAL</h2>
    <p>Olá! Recebemos uma solicitação para redefinir a senha da sua conta.</p>
    <p style="margin: 24px 0;">
      <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}"
         style="background: #059669; color: #ffffff; text-decoration: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; display: inline-block;">
        Redefinir minha senha
      </a>
    </p>
    <p style="font-size: 13px; color: #64748b;">
      Se você não solicitou esta redefinição, ignore este email — nada mudará na sua conta.
    </p>
  </div>
</body>
</html>
